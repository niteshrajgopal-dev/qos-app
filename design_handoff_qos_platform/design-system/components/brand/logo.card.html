<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-canvas);font-family:var(--font-sans)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tile{border-radius:var(--radius-card);border:1px solid var(--border-subtle);padding:22px;display:flex;align-items:center;justify-content:center;min-height:96px}.cap{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-tertiary);font-weight:600;margin:8px 0 0}.row{display:flex;gap:14px;align-items:flex-end;margin-top:14px}</style></head><body>
<div class="grid">
  <div><div class="tile" style="background:var(--surface-default)"><img src="../../assets/logo.png" alt="QOS" style="height:34px"></div><p class="cap">Light background</p></div>
  <div><div class="tile" style="background:rgb(5,9,17);border-color:transparent"><img src="../../assets/logo-on-navy.png" alt="QOS" style="height:34px"></div><p class="cap">Dark background</p></div>
</div>
<div class="row">
  <div><div class="tile" style="background:var(--surface-default);padding:14px"><img src="../../assets/app-icon.png" alt="QOS app icon" style="height:48px;border-radius:12px"></div><p class="cap">App icon 512</p></div>
  <div style="flex:1"><div class="tile" style="background:var(--surface-default);justify-content:flex-start;gap:18px"><img src="../../assets/logo.png" alt="QOS" style="height:18px"><span style="font-size:12px;color:var(--text-secondary)">Minimum 24px wide-mark height · clear space = 2× the O height on all sides</span></div><p class="cap">Minimum size &amp; clear space</p></div>
</div>
</body></html>
